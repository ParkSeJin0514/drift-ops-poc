name: Drift Detect & Revert

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  drift-detect:
    runs-on: ubuntu-latest
    outputs:
      has_drift: ${{ steps.plan.outputs.has_drift }}
      plan_output: ${{ steps.plan.outputs.plan_summary }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
    steps:
      - name: Checkout Terraform code
        uses: actions/checkout@v4
        with:
          repository: ParkSeJin0514/skyline-infra-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Create tfvars
        run: echo '${{ secrets.TERRAFORM_TFVARS }}' > terraform.tfvars

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          set +e
          PLAN_OUTPUT=$(terraform plan -detailed-exitcode -no-color 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$PLAN_OUTPUT" > plan_result.txt

          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_drift=true" >> $GITHUB_OUTPUT

            SUMMARY=$(echo "$PLAN_OUTPUT" | grep "Plan:" | head -1)
            echo "plan_summary=$SUMMARY" >> $GITHUB_OUTPUT

            RESOURCES=$(echo "$PLAN_OUTPUT" | grep "will be" | sed 's/^  # //' | head -5)
            echo "drift_resources<<EOF" >> $GITHUB_OUTPUT
            echo "$RESOURCES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            DETAILS=$(echo "$PLAN_OUTPUT" | grep -A 2 "~\|+\|-" | grep -E "cidr|port|ingress|egress|from_port|to_port|protocol|security_group|instance|ami" | sed 's/^[ ]*//' | head -10)
            echo "drift_details<<EOF" >> $GITHUB_OUTPUT
            echo "$DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "DRIFT DETECTED"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "plan_summary=No changes. Infrastructure is up-to-date." >> $GITHUB_OUTPUT
            echo "drift_resources=none" >> $GITHUB_OUTPUT
            echo "drift_details=none" >> $GITHUB_OUTPUT
            echo "NO DRIFT"
          else
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "plan_summary=Terraform plan failed" >> $GITHUB_OUTPUT
            echo "drift_resources=none" >> $GITHUB_OUTPUT
            echo "drift_details=none" >> $GITHUB_OUTPUT
            echo "PLAN ERROR"
            echo "$PLAN_OUTPUT"
            exit 1
          fi

      - name: Upload plan result
        if: steps.plan.outputs.has_drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan-result
          path: plan_result.txt

      - name: Slack drift 알림
        if: steps.plan.outputs.has_drift == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Drift Detected - Terraform plan 결과 변경사항 발견",
              "attachments": [
                {
                  "color": "warning",
                  "fields": [
                    { "title": "Status", "value": "Drift Detected", "short": true },
                    { "title": "Risk", "value": "High", "short": true },
                    { "title": "Drifted Resources", "value": "${{ steps.plan.outputs.drift_resources }}", "short": false },
                    { "title": "Change Details", "value": "${{ steps.plan.outputs.drift_details }}", "short": false },
                    { "title": "Plan Summary", "value": "${{ steps.plan.outputs.plan_summary }}", "short": false },
                    { "title": "Owner", "value": "Cloud기술팀", "short": true },
                    { "title": "Action", "value": "Revert 승인 필요", "short": true }
                  ]
                },
                {
                  "color": "#439FE0",
                  "text": "승인하기: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }

      - name: Slack no drift 알림
        if: steps.plan.outputs.has_drift == 'false'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "No Drift - Infrastructure is up-to-date",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    { "title": "Status", "value": "No drift detected", "short": true },
                    { "title": "Repository", "value": "skyline-infra-terraform", "short": true }
                  ]
                }
              ]
            }

  revert:
    needs: drift-detect
    if: needs.drift-detect.outputs.has_drift == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
    steps:
      - name: Checkout Terraform code
        uses: actions/checkout@v4
        with:
          repository: ParkSeJin0514/skyline-infra-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Create tfvars
        run: echo '${{ secrets.TERRAFORM_TFVARS }}' > terraform.tfvars

      - name: Terraform Apply (revert to IaC state)
        run: terraform apply -auto-approve -no-color

      - name: Slack 완료 알림
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Drift Revert 완료",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    { "title": "Status", "value": "Reverted to IaC state", "short": true },
                    { "title": "Build", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }

      - name: Slack 실패 알림
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Drift Revert 실패",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Status", "value": "Apply failed", "short": true },
                    { "title": "Build", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }
