name: Drift Detect & Revert

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: drift-ops
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  drift-detect:
    runs-on: ubuntu-latest
    outputs:
      has_drift: ${{ steps.plan.outputs.has_drift }}
      drift_resources: ${{ steps.plan.outputs.drift_resources }}
      drift_details: ${{ steps.plan.outputs.drift_details }}
      plan_summary: ${{ steps.plan.outputs.plan_summary }}
      risk_level: ${{ steps.triage.outputs.risk_level }}
      recommended_action: ${{ steps.triage.outputs.recommended_action }}
      issue_url: ${{ steps.create_issue.outputs.issue_url }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
    steps:
      - name: Checkout Terraform code
        uses: actions/checkout@v4
        with:
          repository: ParkSeJin0514/skyline-infra-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Create tfvars
        run: echo '${{ secrets.TERRAFORM_TFVARS }}' > terraform.tfvars

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          set +e
          PLAN_OUTPUT=$(terraform plan -detailed-exitcode -no-color 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$PLAN_OUTPUT" > plan_result.txt

          if [ $EXIT_CODE -eq 2 ]; then
            echo "has_drift=true" >> $GITHUB_OUTPUT

            SUMMARY=$(echo "$PLAN_OUTPUT" | grep "Plan:" | head -1)
            echo "plan_summary=$SUMMARY" >> $GITHUB_OUTPUT

            RESOURCES=$(echo "$PLAN_OUTPUT" | grep "# .*will be" | sed 's/^.*# //' | sed 's/ will be.*//' | head -5)
            echo "drift_resources<<EOF" >> $GITHUB_OUTPUT
            echo "$RESOURCES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            PLAN_SECTION=$(echo "$PLAN_OUTPUT" | sed -n '/Terraform will perform/,/Plan:/p')
            DETAILS=$(echo "$PLAN_SECTION" | grep -E "^\s+[~+-].*=" | grep -v "Refreshing\|Reading\|Read complete" | sed 's/^[ ]*//' | sed 's/"//g' | head -5)
            echo "drift_details<<EOF" >> $GITHUB_OUTPUT
            echo "$DETAILS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "DRIFT DETECTED"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "plan_summary=No changes." >> $GITHUB_OUTPUT
            echo "drift_resources=none" >> $GITHUB_OUTPUT
            echo "drift_details=none" >> $GITHUB_OUTPUT
            echo "NO DRIFT"
          else
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "plan_summary=Terraform plan failed" >> $GITHUB_OUTPUT
            echo "drift_resources=none" >> $GITHUB_OUTPUT
            echo "drift_details=none" >> $GITHUB_OUTPUT
            echo "PLAN ERROR"
            echo "$PLAN_OUTPUT"
            exit 1
          fi

      - name: Triage Engine
        id: triage
        if: steps.plan.outputs.has_drift == 'true'
        run: |
          RESOURCES="${{ steps.plan.outputs.drift_resources }}"
          PLAN_RESULT=$(cat plan_result.txt)

          RISK="Medium"
          ACTION="Review"
          REASON="수동 판단 필요"
          COLOR="#FAEEDA"

          PLAN_SECTION=$(echo "$PLAN_RESULT" | sed -n '/Terraform will perform/,/Plan:/p')
          CHANGES=$(echo "$PLAN_SECTION" | grep -E "^\s+[~+-].*=" | grep -v "Refreshing\|Reading\|Read complete\|resource \"|data \"")

          ONLY_TAGS="false"
          if [ -n "$CHANGES" ]; then
            NON_TAG_CHANGES=$(echo "$CHANGES" | grep -vi "tags")
            if [ -z "$NON_TAG_CHANGES" ]; then
              ONLY_TAGS="true"
            fi
          fi

          echo "DEBUG CHANGES: $CHANGES"
          echo "DEBUG NON_TAG: $NON_TAG_CHANGES"
          echo "DEBUG ONLY_TAGS: $ONLY_TAGS"

          if [ "$ONLY_TAGS" = "true" ]; then
            RISK="Low"
            ACTION="Accept"
            REASON="태그 변경만 감지 - 운영 영향 없음"
            COLOR="#1D9E75"
          elif echo "$RESOURCES" | grep -qi "security_group"; then
            if echo "$PLAN_RESULT" | grep -qi "0.0.0.0/0"; then
              RISK="Critical"
              ACTION="Revert"
              REASON="전체 인터넷 노출 - 비인가 ingress 추가"
              COLOR="#E24B4A"
            else
              RISK="High"
              ACTION="Review"
              REASON="보안 규칙 변경 감지"
              COLOR="#D85A30"
            fi
          elif echo "$RESOURCES" | grep -qi "iam"; then
            RISK="Critical"
            ACTION="Revert"
            REASON="IAM 권한 변경 - 즉시 대응 필요"
            COLOR="#E24B4A"
          elif echo "$RESOURCES" | grep -qi "db_instance\|rds"; then
            RISK="High"
            ACTION="Review"
            REASON="데이터베이스 변경 - 데이터 영향 확인 필요"
            COLOR="#D85A30"
          elif echo "$RESOURCES" | grep -qi "instance\|launch_template"; then
            RISK="Medium"
            ACTION="Review"
            REASON="컴퓨팅 리소스 변경 - 서비스 영향 확인 필요"
            COLOR="#FAEEDA"
          fi

          echo "risk_level=$RISK" >> $GITHUB_OUTPUT
          echo "recommended_action=$ACTION" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Upload plan result
        if: steps.plan.outputs.has_drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan-result
          path: plan_result.txt

      - name: Create Drift Issue
        if: steps.plan.outputs.has_drift == 'true'
        id: create_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const risk = '${{ steps.triage.outputs.risk_level }}';
            const action = '${{ steps.triage.outputs.recommended_action }}';
            const reason = '${{ steps.triage.outputs.reason }}';
            const resources = `${{ steps.plan.outputs.drift_resources }}`.trim();
            const summary = '${{ steps.plan.outputs.plan_summary }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const now = new Date().toISOString().split('T')[0];

            const labels = ['Drift', risk, action];
            if (action === 'Review') {
              labels.push('Ticket');
            }

            const statusLine = action === 'Revert' ? 'Revert 승인 대기'
                             : action === 'Review' ? 'Ticket - 수동 판단 필요'
                             : 'Accept - 코드 반영 필요';

            const checklist = action === 'Review'
              ? '- [ ] 변경 원인 확인\n- [ ] 영향 범위 분석\n- [ ] Revert 또는 Accept 결정'
              : action === 'Accept'
              ? '- [ ] Terraform 코드에 변경사항 반영\n- [ ] PR 생성 및 리뷰'
              : '- [ ] Revert 승인 완료 확인';

            const body = [
              `## Drift Detection Record`,
              ``,
              `**Status:** ${statusLine}`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Resource** | \`${resources}\` |`,
              `| **Risk** | ${risk} |`,
              `| **Action** | ${action} |`,
              `| **Reason** | ${reason} |`,
              `| **Plan** | ${summary} |`,
              `| **Owner** | Cloud기술팀 |`,
              `| **Detected** | ${now} |`,
              `| **Workflow** | [Run Link](${runUrl}) |`,
              ``,
              `---`,
              `### Follow-up`,
              checklist,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] ${resources} - ${now}`,
              body: body,
              labels: labels
            });

            core.setOutput('issue_url', issue.data.html_url);
            core.setOutput('issue_number', issue.data.number);

      - name: Slack drift 알림
        if: steps.plan.outputs.has_drift == 'true'
        run: |
          RESOURCES=$(echo '${{ steps.plan.outputs.drift_resources }}' | tr '\n' ' ' | xargs)
          DETAILS=$(echo '${{ steps.plan.outputs.drift_details }}' | tr '\n' ', ' | sed 's/,$//' | xargs)
          SUMMARY="${{ steps.plan.outputs.plan_summary }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_URL="${{ steps.create_issue.outputs.issue_url }}"
          RISK="${{ steps.triage.outputs.risk_level }}"
          ACTION="${{ steps.triage.outputs.recommended_action }}"
          REASON="${{ steps.triage.outputs.reason }}"
          COLOR="${{ steps.triage.outputs.color }}"

          if [ "$RISK" = "Critical" ]; then
            RISK_EMOJI=":red_circle:"
          elif [ "$RISK" = "High" ]; then
            RISK_EMOJI=":large_orange_circle:"
          elif [ "$RISK" = "Medium" ]; then
            RISK_EMOJI=":large_yellow_circle:"
          else
            RISK_EMOJI=":large_green_circle:"
          fi

          if [ "$ACTION" = "Revert" ]; then
            ACTION_TEXT="Revert 승인 필요"
            BUTTON1_TEXT="승인하기"
            BUTTON1_URL="${RUN_URL}"
            BUTTON2=",{ \"type\": \"button\", \"text\": { \"type\": \"plain_text\", \"text\": \"Issue 확인\" }, \"url\": \"${ISSUE_URL}\" }"
          elif [ "$ACTION" = "Review" ]; then
            ACTION_TEXT="Ticket 생성됨 - 수동 판단 필요"
            BUTTON1_TEXT="Ticket 확인"
            BUTTON1_URL="${ISSUE_URL}"
            BUTTON2=""
          else
            ACTION_TEXT="Accept - PR 자동 생성됨"
            BUTTON1_TEXT="Issue 확인"
            BUTTON1_URL="${ISSUE_URL}"
            BUTTON2=""
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [
                {
                  \"color\": \"${COLOR}\",
                  \"blocks\": [
                    {
                      \"type\": \"header\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"Drift Detected\" }
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Resource:*\n\`${RESOURCES}\`\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Risk:*\n${RISK_EMOJI} ${RISK}\" }
                      ]
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Reason:*\n${REASON}\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Plan:*\n${SUMMARY}\" }
                      ]
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Owner:*\nCloud기술팀\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Action:*\n${ACTION_TEXT}\" }
                      ]
                    },
                    {
                      \"type\": \"section\",
                      \"text\": { \"type\": \"mrkdwn\", \"text\": \"*Change Details:*\n${DETAILS}\" }
                    },
                    {
                      \"type\": \"divider\"
                    },
                    {
                      \"type\": \"actions\",
                      \"elements\": [
                        {
                          \"type\": \"button\",
                          \"text\": { \"type\": \"plain_text\", \"text\": \"${BUTTON1_TEXT}\" },
                          \"url\": \"${BUTTON1_URL}\",
                          \"style\": \"primary\"
                        }
                        ${BUTTON2}
                      ]
                    }
                  ]
                }
              ]
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack no drift 알림
        if: steps.plan.outputs.has_drift == 'false'
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "attachments": [
                {
                  "color": "#1D9E75",
                  "blocks": [
                    {
                      "type": "header",
                      "text": { "type": "plain_text", "text": "No Drift" }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Status:*\nInfrastructure is up-to-date" },
                        { "type": "mrkdwn", "text": "*Repository:*\nskyline-infra-terraform" }
                      ]
                    }
                  ]
                }
              ]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

  revert:
    needs: drift-detect
    if: needs.drift-detect.outputs.has_drift == 'true' && needs.drift-detect.outputs.recommended_action == 'Revert'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
    steps:
      - name: Checkout Terraform code
        uses: actions/checkout@v4
        with:
          repository: ParkSeJin0514/skyline-infra-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Create tfvars
        run: echo '${{ secrets.TERRAFORM_TFVARS }}' > terraform.tfvars

      - name: Terraform Apply (revert to IaC state)
        run: terraform apply -auto-approve -no-color

      - name: Slack 완료 알림
        if: success()
        run: |
          RESOURCES="${{ needs.drift-detect.outputs.drift_resources }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [
                {
                  \"color\": \"#1D9E75\",
                  \"blocks\": [
                    {
                      \"type\": \"header\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"Drift Revert 완료\" }
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Resource:*\n\`${RESOURCES}\`\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Status:*\n:white_check_mark: Reverted to IaC state\" }
                      ]
                    },
                    {
                      \"type\": \"section\",
                      \"text\": { \"type\": \"mrkdwn\", \"text\": \"<${RUN_URL}|Build 확인>\" }
                    }
                  ]
                }
              ]
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack 실패 알림
        if: failure()
        run: |
          RESOURCES="${{ needs.drift-detect.outputs.drift_resources }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [
                {
                  \"color\": \"#E24B4A\",
                  \"blocks\": [
                    {
                      \"type\": \"header\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"Drift Revert 실패\" }
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Resource:*\n\`${RESOURCES}\`\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Status:*\n:x: Apply failed\" }
                      ]
                    },
                    {
                      \"type\": \"section\",
                      \"text\": { \"type\": \"mrkdwn\", \"text\": \"<${RUN_URL}|Build 확인>\" }
                    }
                  ]
                }
              ]
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

  accept:
    needs: drift-detect
    if: needs.drift-detect.outputs.has_drift == 'true' && needs.drift-detect.outputs.recommended_action == 'Accept'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Terraform code
        uses: actions/checkout@v4
        with:
          repository: ParkSeJin0514/skyline-infra-terraform
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create accept branch and PR
        run: |
          RESOURCES=$(echo '${{ needs.drift-detect.outputs.drift_resources }}' | tr '\n' ' ' | xargs)
          DETAILS=$(echo '${{ needs.drift-detect.outputs.drift_details }}' | tr '\n' ', ' | sed 's/,$//' | xargs)
          SUMMARY="${{ needs.drift-detect.outputs.plan_summary }}"
          ISSUE_URL="${{ needs.drift-detect.outputs.issue_url }}"
          DATE=$(date +%Y%m%d-%H%M%S)
          BRANCH="drift-accept/${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          mkdir -p drift-records

          cat > "drift-records/accept-${DATE}.md" << DOCEOF
          # Drift Accept Record

          - **Date:** $(date +%Y-%m-%d)
          - **Resource:** ${RESOURCES}
          - **Risk:** ${{ needs.drift-detect.outputs.risk_level }}
          - **Reason:** 콘솔 변경을 코드에 반영 (Accept)
          - **Plan:** ${SUMMARY}
          - **Issue:** ${ISSUE_URL}

          ## 변경 내용

          ${DETAILS}

          ## TODO

          - [ ] 해당 리소스의 .tf 코드를 현재 인프라 상태에 맞게 수정
          - [ ] terraform plan으로 drift 해소 확인
          DOCEOF

          git add .
          git commit -m "drift-accept: ${RESOURCES} (${DATE})"
          git push origin "$BRANCH"

          PR_BODY="## Drift Accept

          이 PR은 콘솔에서 발생한 변경을 Terraform 코드에 반영하기 위해 자동 생성되었습니다.

          | Field | Value |
          |-------|-------|
          | **Resource** | \`${RESOURCES}\` |
          | **Risk** | ${{ needs.drift-detect.outputs.risk_level }} |
          | **Plan** | ${SUMMARY} |
          | **Issue** | ${ISSUE_URL} |

          ### TODO
          - [ ] .tf 코드를 현재 인프라 상태에 맞게 수정
          - [ ] terraform plan 확인 (변경사항 0)
          - [ ] 리뷰 후 merge"

          gh pr create \
            --repo ParkSeJin0514/skyline-infra-terraform \
            --base main \
            --head "$BRANCH" \
            --title "[Drift Accept] ${RESOURCES}" \
            --body "$PR_BODY"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Slack Accept PR 알림
        run: |
          RESOURCES=$(echo '${{ needs.drift-detect.outputs.drift_resources }}' | tr '\n' ' ' | xargs)
          PR_URL="https://github.com/ParkSeJin0514/skyline-infra-terraform/pulls"
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [
                {
                  \"color\": \"#1D9E75\",
                  \"blocks\": [
                    {
                      \"type\": \"header\",
                      \"text\": { \"type\": \"plain_text\", \"text\": \"Drift Accept - PR 생성됨\" }
                    },
                    {
                      \"type\": \"section\",
                      \"fields\": [
                        { \"type\": \"mrkdwn\", \"text\": \"*Resource:*\n\`${RESOURCES}\`\" },
                        { \"type\": \"mrkdwn\", \"text\": \"*Status:*\n코드 반영 PR 자동 생성\" }
                      ]
                    },
                    {
                      \"type\": \"actions\",
                      \"elements\": [
                        {
                          \"type\": \"button\",
                          \"text\": { \"type\": \"plain_text\", \"text\": \"PR 확인하기\" },
                          \"url\": \"${PR_URL}\",
                          \"style\": \"primary\"
                        }
                      ]
                    }
                  ]
                }
              ]
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
